<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="none">
  <meta name="theme-color" content="#263240">
  <link rel="icon" href="./favicon.ico">
  <title>空荧酒馆 · 离线地图</title>
  <style>
    @supports (width: 100dvw) {
      html { width: 100dvw; height: 100dvh; }
    }
    @supports not (width: 100dvw) {
      html { width: 100vw; height: 100vh; }
    }
    html {
      overflow: hidden;
      cursor: url('/icons/GensinMouse.svg') 0 0, auto;
      background: #17202b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, #app { width: 100%; height: 100%; }
    #app {
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #ece5d8;
      font-family: system-ui, sans-serif;
    }
    .offline-boot { text-align: center; line-height: 2; }
    .offline-boot small { color: #d3bc8e; }
  </style>
</head>
<body>
  <div id="app">
    <div class="offline-boot">
      <div>正在加载本地地图资源…</div>
      <small>无需网络连接</small>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
